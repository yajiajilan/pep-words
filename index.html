<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEP单词卡 学期整合版</title>
<style>
/* === 样式保持一致且优化 === */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0ece6;color:#222;min-height:100vh}
.top-bar{background:#fff;border-bottom:2px solid #ddd;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.main{max-width:500px;margin:0 auto;padding:16px}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.progress-track{height:3px;background:#ddd;border-radius:2px;margin-bottom:14px}
.progress-fill{height:100%;background:#444;transition:width .2s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.stat-box{text-align:center;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:8px 2px}
.stat-num{font-size:18px;font-weight:700}
.stat-label{font-size:10px;color:#999}
.card-box{width:100%;height:240px;position:relative;cursor:pointer;perspective:1000px;margin-bottom:14px}
.card-inner{width:100%;height:100%;position:relative;transition:transform 0.6s;transform-style:preserve-3d}
.card-side{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border:2px solid #ddd;background:#fff}
.card-back{background:#f8fdf5;border-color:#a8d98a;transform:rotateY(180deg)}
.flipped .card-inner{transform:rotateY(180deg)}
.w-en{font-size:36px;font-weight:700;word-break:break-all}
.w-cn{font-size:26px;font-weight:700}
.ctrl-row{display:flex;gap:8px;margin-bottom:14px}
.btn-ctrl{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
.btn-ctrl.primary{background:#333;color:#fff;border-color:#333}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;text-align:center}
.tab.on{background:#333;color:#fff}
.test-area,.rev-area{display:none;background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:14px;text-align:center}
.test-in{width:100%;padding:12px;font-size:18px;border:2px solid #ccc;border-radius:8px;margin:10px 0;text-align:center}
.btn-row{display:flex;gap:10px;margin-top:15px;width:100%}
.btn-mk{flex:1;padding:12px;border-radius:20px;border:none;font-weight:600;cursor:pointer}
.btn-no{background:#f8bfbf;color:#d44}.btn-yes{background:#5a5;color:#fff}
select{padding:8px;border-radius:6px;border:1px solid #ccc;width:180px}
</style>
</head>
<body>

<div class="top-bar">
  <h1>📚 PEP 单词大通关</h1>
  <select id="selGrade" onchange="onGradeChange()"></select>
</div>

<div class="main">
  <div class="progress-info"><span id="pLabel">正在加载...</span><span id="uLabel">---</span></div>
  <div class="progress-track"><div class="progress-fill" id="pBar" style="width:0%"></div></div>

  <div class="stats">
    <div class="stat-box"><div class="stat-num" id="stT">0</div><div class="stat-label">本次已学</div></div>
    <div class="stat-box"><div class="stat-num" id="stK" style="color:#5a5">0</div><div class="stat-label">认识</div></div>
    <div class="stat-box"><div class="stat-num" id="stX" style="color:#c44">0</div><div class="stat-label">需复习</div></div>
    <div class="stat-box"><div class="stat-num" id="stR">-</div><div class="stat-label">正确率</div></div>
  </div>

  <div id="cardArea">
    <div class="card-box" id="cardBox" onclick="onCardTap()">
      <div class="card-inner" id="cardInner">
        <div class="card-side card-front">
          <div class="w-en" id="wEn">...</div>
          <div id="wPh" style="color:#bbb;margin-top:8px;font-size:14px"></div>
        </div>
        <div class="card-side card-back">
          <div class="w-cn" id="wCn"></div>
          <div id="wPos" style="color:#888;margin-top:8px"></div>
          <div class="btn-row">
            <button class="btn-mk btn-no" onclick="event.stopPropagation();doMark(false)">✗ 不认识</button>
            <button class="btn-mk btn-yes" onclick="event.stopPropagation();doMark(true)">✓ 认识</button>
          </div>
        </div>
      </div>
    </div>
    <div class="ctrl-row">
      <button class="btn-ctrl" onclick="goPrev()">上一个</button>
      <button class="btn-ctrl primary" onclick="doFlip()">翻转卡片</button>
      <button class="btn-ctrl" onclick="goNext()">下一个</button>
    </div>
  </div>

  <div id="testArea" class="test-area">
    <div id="tQ" style="font-size:20px;font-weight:700;margin-bottom:10px"></div>
    <input class="test-in" id="tIn" placeholder="请拼写英文单词" autocomplete="off">
    <div class="btn-row">
        <button class="btn-ctrl primary" onclick="doCheck()">检查答案</button>
        <button class="btn-ctrl" onclick="goNext()">跳过</button>
    </div>
  </div>

  <div id="revArea" class="rev-area">
      <h3 style="margin-bottom:10px;font-size:16px">我的复习清单</h3>
      <div id="revList" style="text-align:left;font-size:14px;line-height:2"></div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tMem" onclick="setMode('mem')">📖 记忆</button>
    <button class="tab" id="tTest" onclick="setMode('test')">✍️ 测试</button>
    <button class="tab" id="tRev" onclick="setMode('rev')">📝 错题</button>
  </div>
</div>

// === 核心逻辑控制 ===
var currentGrade = "3A";
var currentIndex = 0;
var isFlipped = false;
var currentMode = "mem";
var stats = { total: 0, known: 0, wrong: 0 };
var wrongList = [];

// 初始化界面
function init() {
    const sel = document.getElementById('selGrade');
    sel.innerHTML = Object.keys(RAW_DATA).map(k => `<option value="${k}">${RAW_DATA[k].name}</option>`).join('');
    loadGrade("3A");
}

// 切换学期
function loadGrade(gradeKey) {
    currentGrade = gradeKey;
    currentIndex = 0;
    render();
}

function onGradeChange() {
    loadGrade(document.getElementById('selGrade').value);
}

// 渲染当前单词
function render() {
    const list = RAW_DATA[currentGrade].words;
    const word = list[currentIndex];

    // 更新内容
    document.getElementById('wEn').textContent = word.en;
    document.getElementById('wPh').textContent = word.ph || "";
    document.getElementById('wCn').textContent = word.cn;
    document.getElementById('wPos').textContent = word.pos || "";

    // 更新进度条
    document.getElementById('pLabel').textContent = `进度: ${currentIndex + 1} / ${list.length}`;
    document.getElementById('uLabel').textContent = RAW_DATA[currentGrade].name;
    document.getElementById('pBar').style.width = ((currentIndex + 1) / list.length * 100) + "%";

    resetCard();
    if(currentMode === 'test') prepareTest();
}

// 翻转逻辑
function doFlip() {
    isFlipped = !isFlipped;
    document.getElementById('cardBox').classList.toggle('flipped', isFlipped);
}
function resetCard() {
    isFlipped = false;
    document.getElementById('cardBox').classList.remove('flipped');
}
function onCardTap() { if(currentMode === 'mem') doFlip(); }

// 切换单词
function goPrev() { if(currentIndex > 0) { currentIndex--; render(); } }
function goNext() {
    if(currentIndex < RAW_DATA[currentGrade].words.length - 1) {
        currentIndex++; render();
    } else {
        alert("本学期单词已全部学完！🎉");
    }
}

// 记忆模式：手动标记
function doMark(isKnown) {
    stats.total++;
    if(isKnown) {
        stats.known++;
    } else {
        stats.wrong++;
        addWrong(RAW_DATA[currentGrade].words[currentIndex]);
    }
    updateStats();
    goNext();
}

// 更新统计
function updateStats() {
    document.getElementById('stT').textContent = stats.total;
    document.getElementById('stK').textContent = stats.known;
    document.getElementById('stX').textContent = stats.wrong;
    const rate = stats.total ? Math.round(stats.known / stats.total * 100) : 0;
    document.getElementById('stR').textContent = rate + "%";
}

// 添加错题
function addWrong(word) {
    if(!wrongList.some(w => w.en === word.en)) {
        wrongList.push(word);
    }
}

// 模式切换
function setMode(m) {
    currentMode = m;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.getElementById('cardArea').style.display = (m === 'mem') ? 'block' : 'none';
    document.getElementById('testArea').style.display = (m === 'test') ? 'block' : 'none';
    document.getElementById('revArea').style.display = (m === 'rev') ? 'block' : 'none';

    if(m === 'mem') document.getElementById('tMem').classList.add('on');
    if(m === 'test') { document.getElementById('tTest').classList.add('on'); render(); }
    if(m === 'rev') {
        document.getElementById('tRev').classList.add('on');
        const list = document.getElementById('revList');
        list.innerHTML = wrongList.length ?
            wrongList.map((w, i) => `<div>${i+1}. <b>${w.en}</b> - ${w.cn}</div>`).join('') :
            '<div style="text-align:center;color:#999;padding:20px">暂无错题，继续加油！</div>';
    }
}

// 测试功能
function prepareTest() {
    const word = RAW_DATA[currentGrade].words[currentIndex];
    document.getElementById('tQ').textContent = word.cn + " = ?";
    document.getElementById('tIn').value = "";
    document.getElementById('tIn').focus();
}

function doCheck() {
    const ans = document.getElementById('tIn').value.trim().toLowerCase();
    const correct = RAW_DATA[currentGrade].words[currentIndex].en.toLowerCase();
    stats.total++;
    if(ans === correct) {
        alert("✅ 正确！");
        stats.known++;
    } else {
        alert("❌ 错误！正确拼写是: " + correct);
        stats.wrong++;
        addWrong(RAW_DATA[currentGrade].words[currentIndex]);
    }
    updateStats();
    goNext();
}

window.onload = init;
</script>
